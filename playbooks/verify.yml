---
- name: Verify AirVPN client installation and kill-switch posture
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars_files:
    - "{{ playbook_dir }}/../example.config.yml"
  tasks:
    - name: Stat local config.yml
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../config.yml"
      register: airvpn_local_config

    - name: Load local config.yml overrides when present
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../config.yml"
      when: airvpn_local_config.stat.exists

    - name: Run offline checks
      ansible.builtin.command:
        cmd: "{{ airvpn_bin_dir | default('/usr/local/bin') }}/airvpn-check --offline"
      register: airvpn_verify
      changed_when: false

    - name: Show verification output
      ansible.builtin.debug:
        msg: "{{ airvpn_verify.stdout_lines }}"
