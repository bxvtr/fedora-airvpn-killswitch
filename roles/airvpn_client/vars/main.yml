---
# Internal role variables (not public configuration).
#
# Known former project *default* firewalld policy names kept only for exact
# upgrade migration and uninstall cleanup. This is not a free-form delete list:
# do not add unrelated names, wildcards, or admin-owned policies here.
# Overrides via config.yml / extra-vars are unsupported and discouraged.
#
# Historical note: airvpn-host-to-underlay (23 chars) exceeds the current
# Fedora max_policy_name_len of 18 and could not be created on that limit;
# it remains a defensive exact-name cleanup candidate for older or partial
# installs. airvpn-host-to-vpn (18 chars) was a former creatable default.

airvpn_legacy_default_policy_names:
  - airvpn-host-to-vpn
  - airvpn-host-to-underlay
