---
name: Secret scan
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Use the pinned gitleaks CLI directly. gitleaks-action derives a commit
      # range with <sha>^ which fails for root commits in new repositories.
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -Eeuo pipefail
          workdir="$(mktemp -d)"
          archive="${workdir}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o "${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${workdir}" gitleaks
          chmod 0755 "${workdir}/gitleaks"
          echo "${workdir}" >> "${GITHUB_PATH}"
          "${workdir}/gitleaks" version
      - name: Run Gitleaks on full repository history
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact
