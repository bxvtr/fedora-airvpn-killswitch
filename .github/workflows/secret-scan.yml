---
name: Secret scan
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Use the pinned gitleaks CLI directly. gitleaks-action derives a commit
      # range with <sha>^ which fails for root commits in new repositories.
      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -Eeuo pipefail
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run Gitleaks on full repository history
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --redact
