[defaults]
inventory = inventory/localhost.yml
roles_path = roles
# ansible-core expects the singular ini key "collections_path" (COLLECTIONS_PATHS).
# The plural "collections_paths" is ignored, so repo-local installs under
# .ansible/collections would not be discovered without ANSIBLE_COLLECTIONS_PATH.
collections_path = .ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
gathering = smart
timeout = 30
# Keep Ansible away from printing potentially sensitive module args in verbose mode
# by preferring no_log on secret-bearing tasks in the role.

[privilege_escalation]
become = True
become_method = sudo

[inventory]
enable_plugins = host_list, script, auto, yaml, ini
